{% extends 'main/layout.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<section class="auth-card">
    <div class="mb-4">
        <h1 class="mb-2">З поверненням</h1>
        <p class="text-secondary mb-0">Увійдіть до свого облікового запису.</p>
    </div>
    <form method="post" class="d-flex flex-column gap-3">
        {% csrf_token %}
        <input class="form-control" type="text" name="username" placeholder="Нікнейм" required>
        <input class="form-control" type="password" name="password" placeholder="Пароль" required>
        {% if error %}<p class="text-danger mb-0">{{ error }}</p>{% endif %}
        <button class="btn btn-primary" type="submit">Увійти</button>
    </form>
</section>
{% endblock %}
