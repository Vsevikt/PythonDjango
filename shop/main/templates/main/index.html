{% extends 'main/layout.html' %}
{% block title %}
Main Page
{% endblock %}

{%block content%}
  <!-- Заголовок -->
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold">Вітаємо на нашому сайті!</h1>
            <p class="fs-5 text-muted">
                Це головна сторінка сайта
            </p>
            <button class="btn btn-primary">
                Детальніше
            </button>
        </div>
        <<form method="POST" action="{% url 'create' %}" enctype="multipart/form-data">
              {% csrf_token %}
            <input type="text" name= "title" class="form-ghost" placeholder="Title">
            <input type="text" name= "description" class="form-ghost" placeholder="Description">
            <input type="file" name= "image" class="form-ghost" placeholder="Image">
            <button type="submit">Create</button>
        </form>
        <form action="{% url 'search' %}">
          <input type="search" name= "title" class="form-ghost" placeholder="Search...">
              <input type="submit" value="OK">
        </form>
{%endblock%}
