
{% extends 'main/layout.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="d-flex flex-column gap-2">
    {% csrf_token %}

    <input type="text" name="first_name" placeholder="Ім’я" required>
    <input type="text" name="last_name" placeholder="Прізвище">
    <input type="email" name="email" placeholder="Email" required>
    <input type="date" name="date_of_birth">
    <input type="password" name="password" placeholder="Пароль" required>
    <input type="password" name="passwordRepeat" placeholder="Повторіть пароль" required>

    <label>Аватар:</label>

    <div style="width: 150px; height: 150px; border: 2px solid #ccc; overflow: hidden;">
        <img id="avatarPreview"
             src="{% if person.avatar %}{{ person.avatar.url }}{% endif %}"
             style="width: 100%; height: 100%; object-fit: cover; display: {% if person.avatar %}block{% else %}none{% endif %};">
    </div>

    <input type="file" name="avatar" accept="image/*" onchange="previewAvatar(event)">

    {% if error %}
        <p class="text-danger">{{ error }}</p>
    {% endif %}

    <button type="submit">Зареєструватися</button>
</form>

<script>
function previewAvatar(event) {
    const image = document.getElementById('avatarPreview');
    const file = event.target.files[0];

    if (file) {
        image.src = URL.createObjectURL(file);
        image.style.display = 'block';
    }
}
</script>
{% endblock %}
