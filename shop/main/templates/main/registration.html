{% extends 'main/layout.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<section class="auth-card">
    <div class="mb-4">
        <h1 class="mb-2">Створити обліковий запис</h1>
        <p class="text-secondary mb-0">Заповніть дані, щоб приєднатися.</p>
    </div>
<form method="post" enctype="multipart/form-data" class="d-flex flex-column gap-3">
    {% csrf_token %}

    <input class="form-control" type="text" name="username" placeholder="Нікнейм" maxlength="20" value="{{ username|default:'' }}" required>
    <div class="row g-3">
        <div class="col-md-6"><input class="form-control" type="text" name="first_name" placeholder="Ім’я" required></div>
        <div class="col-md-6"><input class="form-control" type="text" name="last_name" placeholder="Прізвище"></div>
    </div>
    <input class="form-control" type="email" name="email" placeholder="Email" required>
    <label class="form-label mb-0" for="date_of_birth">Дата народження</label>
    <input class="form-control" id="date_of_birth" type="date" name="date_of_birth">
    <input class="form-control" type="password" name="password" placeholder="Пароль" required>
    <input class="form-control" type="password" name="passwordRepeat" placeholder="Повторіть пароль" required>

    <label class="form-label mb-0">Аватар</label>

    <div>
        <img id="avatarPreview"
             src="{% if person.avatar %}{{ person.avatar.url }}{% endif %}"
             class="avatar-preview{% if not person.avatar %} d-none{% endif %}">
    </div>

    <input class="form-control" type="file" name="avatar" accept="image/*">

    {% if error %}
        <p class="text-danger">{{ error }}</p>
    {% endif %}

    <button class="btn btn-primary" type="submit">Зареєструватися</button>
</form>
</section>
{% endblock %}
