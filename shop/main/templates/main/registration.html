{% extends 'main/layout.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<form method="post" class="d-flex flex-column gap-2">
    {% csrf_token %}
    <input name="username" placeholder="Логін" required>
    <input name="first_name" placeholder="Ім’я" required>
    <input name="password" type="password" placeholder="Пароль" required>
    <input name="passwordRepeat" type="password" placeholder="Повторіть пароль" required>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <button type="submit">Зареєструватися</button>
</form>
{% endblock %}
