{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{%endblock%}</title>

    <!-- Bootstrap 5 -->
    <link href="{% static 'main/css/bootstrap.min.css' %}" rel="stylesheet">
    <script defer src="{% static 'main/js/create_card.js' %}"></script>

</head>
<body class="bg-light">
    <!-- Меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Мій сайт</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">Про нас</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/services">Послуги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contacts">Контакти</a>
                    </li><li class="nav-item">
                        <a class="nav-link" href="/registration">Реєстрація</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основний контент -->
    <main class="container mt-4">
    {% block content %}
        {% endblock %}
        <!-- Блоки контенту -->
        </main>

    <!-- Підвал -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 Мій сайт. Усі права захищені.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="{% static 'main/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
